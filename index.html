<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teve App - Colombia</title>
  
  <!-- Librería HLS.js para reproductores directos -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: #0f172a; 
      color: white; 
      margin: 0; 
      padding: 15px; 
      text-align: center; 
    }

    h1 { color: #f87171; font-size: 22px; margin-bottom: 20px; }

    .card-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
      gap: 12px; 
      max-width: 600px;
      margin: 0 auto 20px auto;
    }

    .channel-card { 
      background: #1e293b; 
      border-radius: 12px; 
      padding: 15px; 
      cursor: pointer; 
      transition: 0.2s; 
      border: 2px solid transparent; 
    }

    .channel-card:hover, .channel-card:active { 
      border-color: #38bdf8; 
      transform: scale(0.97); 
    }

    .player-container { 
      width: 100%; 
      max-width: 600px; 
      margin: 0 auto; 
    }

    video { 
      width: 100%; 
      aspect-ratio: 16/9;
      border-radius: 12px; 
      background: #000; 
      border: none;
    }

    .btn-caracol {
      background: #e11d48;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>📺 Teve App Colombia</h1>

  <!-- Botones de Canales -->
  <div class="card-grid">
    <div class="channel-card" onclick="openCaracol()">
      <h3>🔴 Caracol TV</h3>
    </div>
    <div class="channel-card" onclick="loadHls('https://rtvc-live-fast.yospace.com/stream/rtvc-senaltv-fast/index.m3u8', 'Señal Colombia')">
      <h3>Señal Colombia</h3>
    </div>
    <div class="channel-card" onclick="loadHls('https://unlimited3-us.streambay.pool.streamm.tv/hls/teleantioquia.m3u8', 'Teleantioquia')">
      <h3>Teleantioquia</h3>
    </div>
  </div>

  <!-- Pantalla del Reproductor -->
  <div class="player-container">
    <h3 id="current-channel-title">Selecciona un canal para comenzar</h3>
    <div id="media-holder">
      <video id="video-player" controls playsinline autoplay></video>
    </div>
  </div>

  <script>
    const titleText = document.getElementById('current-channel-title');
    const mediaHolder = document.getElementById('media-holder');
    let hls = null;

    // Redirección directa a la señal de Caracol para omitir bloqueos CSP/iFrame
    function openCaracol() {
      titleText.innerText = "Canal: Caracol TV (Señal Oficial)";
      if (hls) { hls.destroy(); }
      
      mediaHolder.innerHTML = `
        <div style="padding: 20px; background: #1e293b; border-radius: 12px;">
          <p>Caracol TV requiere abrir la transmisión directa para evitar bloqueos del reproductor.</p>
          <a href="https://www.caracoltv.com/senal-vivo" target="_blank" class="btn-caracol">▶ Abrir Caracol TV en Vivo</a>
        </div>
      `;
      window.open('https://www.caracoltv.com/senal-vivo', '_blank');
    }

    // Carga HLS interna para canales sin bloqueo
    function loadHls(streamUrl, channelName) {
      titleText.innerText = "Canal: " + channelName;
      
      mediaHolder.innerHTML = `<video id="video-player" controls playsinline autoplay></video>`;
      const video = document.getElementById('video-player');

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play();
      } else if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play();
        });
      }
    }
  </script>
</body>
</html>
